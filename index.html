<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SMKPB Mail Merge</title>
  <style>
    body { margin: 0; font: 15px/1.5 "Segoe UI", -apple-system, Arial, sans-serif; color: #1b1d1f; background: #fff; }
    main { max-width: 560px; margin: 48px auto; padding: 0 16px; }
    h1 { font-size: 22px; margin: 0 0 8px; }
    p { color: #5f6368; }
    a { color: #1f5f4a; }
    @media (prefers-color-scheme: dark) { body { background: #1f1f1f; color: #ececec; } p { color: #a8a8a8; } a { color: #5fb393; } }
  </style>
</head>
<body>
  <main>
    <h1>SMKPB Mail Merge</h1>
    <p>An Outlook add-in that sends a personalized email to everyone in a table. It runs inside Outlook; open it from the Apps button on any email.</p>
    <p><a href="manifest.xml">Download the manifest</a> to install it (Outlook on the web → Get Add-ins → My add-ins → Add a custom add-in → Add from file).</p>
  </main>
</body>
</html>
